<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>成長型塔防遊戲 - Growth Tower Defense</title>
  <!--
  ================================================================================
                                  程式碼項目目錄
  ================================================================================
  1. HTML 全局結構與 CSS 樣式 (Style Sheet)
  2. 全局變數與遊戲狀態設定 (Global Variables & Configs)
  3. 輔助函式與音效系統 (Helper Functions & Audio System)
  4. UI 彈窗與浮動文字系統 (UI Modals, Toasts & Floating Texts)
  5. 存檔與載入系統 (LocalStorage & Checkpoint System)
  6. 建造與選取邏輯 (Tower Placement & Selection Management)
  7. 波次生成與敵人邏輯 (Wave Management & Enemy Spawning)
  8. 主動技能系統 (Active Skills Management)
  9. 全局科技樹系統 (Global Tech Tree System)
  10. 遊戲核心主迴圈與狀態更新 (Game Loop & State Updates)
  11. 遊戲畫面繪製與視覺特效 (Rendering Engine & VFX)
  12. 遊戲初始化與事件監聽 (Initialization & Event Listeners)
  ================================================================================
  -->
  
  <!-- ==========================================================================
       1. HTML 全局結構與 CSS 樣式 (Style Sheet)
       ========================================================================== -->
  <style>
    :root {
      --bg-color: #12131C;
      --panel-bg: #1e1f29;
      --card-bg: #282a36;
      --border-color: #44475a;
      --primary: #50fa7b;
      --danger: #ff5555;
      --purple: #bd93f9;
      --cyan: #8be9fd;
      --yellow: #f1fa8c;
      --orange: #ffb86c;
      --white: #fff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: var(--bg-color); color: var(--white);
      font-family: 'Segoe UI', system-ui, sans-serif;
      display: flex; flex-direction: column; align-items: center;
      min-height: 100vh; padding: 10px;
    }
    #game-header, #controls-bar, #panel-container { width: 100%; max-width: 1000px; }
        
    #game-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 20px; background: var(--panel-bg); border-radius: 8px;
      margin-bottom: 10px; border: 1px solid var(--card-bg); z-index: 250; position: relative;
    }
    .res-item { display: flex; align-items: center; font-size: 15px; font-weight: bold; }
    .res-icon { font-size: 18px; margin-right: 6px; }
    #game-container {
      position: relative; width: 1000px; height: 600px;
      background: #111; border-radius: 8px; overflow: hidden; touch-action: none;
    }
    canvas { display: block; cursor: crosshair; }
    /* Boss 血條 */
    #boss-hp-container {
      position: absolute; top: 15px; left: 50%; transform: translateX(-50%);
      width: 460px; background: rgba(0, 0, 0, 0.85); border: 2px solid var(--danger);
      border-radius: 10px; padding: 8px 14px; display: none; text-align: center;
      z-index: 30; pointer-events: none;
    }
    #boss-hp-title { font-size: 14px; color: var(--danger); font-weight: bold; margin-bottom: 4px; }
    #boss-hp-bar-bg { width: 100%; height: 14px; background: #411; border-radius: 7px; overflow: hidden; border: 1px solid #f66; }
    #boss-hp-bar-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #f11, #f70); transition: width 0.1s linear; }
    #boss-hp-text { font-size: 12px; margin: 2px 0 4px; font-family: monospace; }
    #boss-traits { font-size: 11px; color: var(--cyan); line-height: 1.3; }
    /* Toast 訊息 */
    #toast-container { position: absolute; top: 15px; right: 15px; display: flex; flex-direction: column; gap: 8px; z-index: 260; pointer-events: none; }
    .toast { background: rgba(20, 20, 30, 0.95); border-left: 4px solid var(--orange); padding: 10px 15px; border-radius: 4px; font-size: 13px; }
    /* 敵人介紹彈窗 */
    #enemy-intro-popup {
      position: absolute; bottom: 15px; right: 15px; width: 280px;
      background: rgba(20, 20, 30, 0.95); border: 2px solid var(--purple);
      border-radius: 8px; padding: 12px; z-index: 260; display: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    #enemy-intro-popup .close-btn {
      position: absolute; top: 6px; right: 10px; color: var(--danger);
      font-weight: bold; cursor: pointer; font-size: 16px;
    }
    #enemy-intro-title { font-weight: bold; font-size: 14px; color: var(--primary); margin-bottom: 6px; padding-right: 15px; }
    #enemy-intro-desc { font-size: 12px; color: #f8f8f2; line-height: 1.4; white-space: pre-line; }
    /* UI 按鈕與控制列 */
    #controls-bar { display: flex; gap: 10px; margin-top: 10px; z-index: 50; position: relative; }
    .btn {
      background: var(--card-bg); color: #f8f8f2; border: 1px solid var(--border-color);
      padding: 10px 18px; border-radius: 6px; font-weight: bold; cursor: pointer;
      transition: all 0.15s; display: flex; align-items: center; justify-content: center; gap: 6px;
    }
    .btn:hover { background: var(--border-color); }
    .btn:active { transform: scale(0.96); }
    .btn-primary { background: var(--primary); color: #181920; border: none; }
    .btn-primary:hover { background: #70fa9b; }
    .btn-primary.disabled-wave {
      filter: grayscale(100%);
      opacity: 0.6;
      cursor: not-allowed;
    }
    .btn-danger { background: var(--danger); color: var(--white); border: none; }
    .btn-danger:hover { background: #ff7777; }
    .btn-active { border: 2px solid var(--primary); box-shadow: 0 0 8px rgba(80, 250, 123, 0.6); }
    
    #trash-cancel-btn {
      display: none;
      background: var(--danger);
      color: var(--white);
      border: none;
      border-radius: 6px;
      padding: 10px 14px;
      font-size: 16px;
      cursor: pointer;
      transition: transform 0.2s ease, background-color 0.2s ease;
      align-items: center;
      justify-content: center;
    }
    #trash-cancel-btn:hover {
      transform: scale(1.2);
      background: #ff3333;
    }

    /* 面板與卡片 */
    #panel-container { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 10px; margin-top: 10px; z-index: 50; position: relative; }
    .panel { background: var(--panel-bg); border-radius: 8px; padding: 12px; border: 1px solid var(--card-bg); }
    .panel-title { font-size: 14px; font-weight: bold; margin-bottom: 10px; color: var(--cyan); border-bottom: 1px solid var(--card-bg); padding-bottom: 6px; }
    .grid-shop { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
    .card {
      position: relative; background: var(--card-bg); border: 1px solid var(--border-color);
      border-radius: 6px; padding: 8px; cursor: pointer; transition: all 0.2s;
      display: flex; flex-direction: column; justify-content: space-between; overflow: hidden;
    }
    .card:hover { border-color: var(--purple); transform: translateY(-2px); }
    .card-name { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
    .card-stats { font-size: 10px; color: var(--cyan); margin-bottom: 4px; line-height: 1.3; }
    .card-desc { font-size: 10px; color: var(--yellow); margin-bottom: 6px; }
    .card-cost { font-size: 11px; color: var(--orange); font-weight: bold; }
    .skill-lock-overlay {
      position: absolute; inset: 0; background: rgba(10, 10, 15, 0.88);
      display: flex; justify-content: center; align-items: center;
      color: var(--danger); font-size: 12px; font-weight: bold; z-index: 10; backdrop-filter: blur(2px);
    }
    /* 升級面板與彈窗 */
    #tower-upgrade-overlay {
      position: absolute; bottom: 20px; left: 20px; background: rgba(30, 31, 41, 0.95);
      border: 1px solid var(--purple); border-radius: 8px; padding: 12px; width: 330px; display: none; z-index: 60;
    }
    .upg-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; font-size: 12px; }
    #confirm-placement-bar {
      position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
      background: rgba(30, 31, 41, 0.95); border: 1px solid var(--primary);
      padding: 10px 20px; border-radius: 30px; display: none; gap: 12px; z-index: 70;
    }
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: none; justify-content: center; align-items: center; z-index: 200;
      pointer-events: auto;
    }
    .modal-content {
      background: var(--panel-bg); border-radius: 10px; padding: 20px;
      width: 480px; max-width: 90%; max-height: 85vh; overflow-y: auto; border: 1px solid var(--border-color);
      box-shadow: 0 8px 30px rgba(0,0,0,0.8);
    }
    .mode-toggle-btn {
      background: #333; color: #fff; border: 1px solid var(--purple);
      padding: 4px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; margin-top: 4px;
    }
    .mode-toggle-btn:hover { background: var(--purple); color: #000; }
  </style>
</head>

<script>

// ============================================================================
// 3. 輔助函式與音效系統 (Helper Functions & Audio System)
// ============================================================================
function toTwoSigFigsTrunc(val) {
  if (val <= 0) return 0;
  let exponent = Math.floor(Math.log10(val));
  let scale = Math.pow(10, exponent - 1);
  return Math.floor(val / scale) * scale;
}

const AudioCtx = window.AudioContext || window.webkitAudioContext;
let audioCtx = null;
let humOsc = null, humGain = null;

function startHumSound() {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    if (!humOsc) {
      humOsc = audioCtx.createOscillator();
      humGain = audioCtx.createGain();
      humOsc.type = 'triangle';
      humOsc.frequency.setValueAtTime(55, audioCtx.currentTime);
      humGain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      humOsc.connect(humGain);
      humGain.connect(audioCtx.destination);
      humOsc.start();
    }
  } catch(e) {}
}

function stopHumSound() {
  if (humOsc) {
    try { humOsc.stop(); humOsc.disconnect(); } catch(e){}
    humOsc = null; humGain = null;
  }
}

function playSound(type) {
  try {
    if (!audioCtx) audioCtx = new AudioCtx();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    let now = audioCtx.currentTime;
    if (type === 'shoot') {
      osc.frequency.setValueAtTime(400, now); osc.frequency.exponentialRampToValueAtTime(100, now + 0.1);
      gain.gain.setValueAtTime(0.08, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'hit') {
      osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(40, now + 0.12);
      gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.12);
      osc.start(now); osc.stop(now + 0.12);
    } else if (type === 'skill') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(200, now); osc.frequency.linearRampToValueAtTime(600, now + 0.3);
      gain.gain.setValueAtTime(0.15, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'zap') {
      osc.type = 'sawtooth'; osc.frequency.setValueAtTime(800, now); osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
      gain.gain.setValueAtTime(0.12, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
      osc.start(now); osc.stop(now + 0.08);
    } else if (type === 'hammerImpact') {
      osc.type = 'square'; osc.frequency.setValueAtTime(80, now); osc.frequency.exponentialRampToValueAtTime(20, now + 0.25);
      gain.gain.setValueAtTime(0.3, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    } else if (type === 'gearRotate') {
      osc.type = 'triangle'; osc.frequency.setValueAtTime(300, now); osc.frequency.linearRampToValueAtTime(150, now + 0.15);
      gain.gain.setValueAtTime(0.05, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
      osc.start(now); osc.stop(now + 0.15);
    }
  } catch(e) {}
}

// 5. 存檔與載入系統 (LocalStorage & Checkpoint System)
// ============================================================================
function saveGameToLocalStorage() {
  const saveData = {
    currentWave, hp, gold, crystals, stats,
    talents: Object.keys(talents).reduce((acc, k) => { acc[k] = talents[k].lv; return acc; }, {}),
    activeSkills: Object.keys(activeSkills).reduce((acc, k) => {
      acc[k] = { valLv: activeSkills[k].valLv, cdLv: activeSkills[k].cdLv };
      return acc;
    }, {}),
    towers: towers.map(t => ({
      type: t.type, x: t.x, y: t.y, dmgLv: t.dmgLv, rngLv: t.rngLv, spdLv: t.spdLv, specLv: t.specLv, infernoMode: t.infernoMode || 1
    })),
    checkpointState
  };
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(saveData));
  } catch(e) {}
}

function loadGameFromLocalStorage() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return;
    const data = JSON.parse(raw);
    currentWave = data.currentWave || 0;
    hp = data.hp ?? 100;
    gold = data.gold ?? 300;
    crystals = data.crystals ?? 0;
    if (data.stats) stats = data.stats;
    if (data.checkpointState) checkpointState = data.checkpointState;
    if (data.talents) {
      Object.keys(data.talents).forEach(k => { if (talents[k]) talents[k].lv = data.talents[k]; });
    }
    if (data.activeSkills) {
      Object.keys(data.activeSkills).forEach(k => {
        if (activeSkills[k]) {
          activeSkills[k].valLv = data.activeSkills[k].valLv;
          activeSkills[k].cdLv = data.activeSkills[k].cdLv;
        }
      });
    }
    if (Array.isArray(data.towers)) {
      towers = data.towers.map(t => ({
        id: Date.now() + Math.random(), type: t.type, x: t.x, y: t.y,
        dmgLv: t.dmgLv, rngLv: t.rngLv, spdLv: t.spdLv, specLv: t.specLv,
        cooldown: 0, disableTimer: 0, drumTimer: 0, hammerState: 'idle', hammerHeight: 0, hammerRot: 0, hammerScale: 1, attackTickCount: 0,
        infernoMode: t.infernoMode || 1, targetLockId: null, lockTime: 0
      }));
    }
  } catch(e) {}
}

function isValidPlacement(x, y) {
  if (x < 30 || x > 900 || y < 30 || y > 570) return false;
  if (towers.some(t => Math.hypot(t.x - x, t.y - y) < 38)) return false;
  for (let i = 0; i < path.length - 1; i++) {
    if (distToSegment({x, y}, path[i], path[i+1]) < 35) return false;
  }
  return true;
}

function distToSegment(p, v, w) {
  let l2 = (v.x - w.x)**2 + (v.y - w.y)**2;
  if (l2 === 0) return Math.hypot(p.x - v.x, p.y - v.y);
  let t = Math.max(0, Math.min(1, ((p.x - v.x) * (w.x - v.x) + (p.y - v.y) * (w.y - v.y)) / l2));
  return Math.hypot(p.x - (v.x + t * (w.x - v.x)), p.y - (v.y + t * (w.y - v.y)));
}

function upgradeTowerStat(stat) {
  if (!selectedTower) return;
  if (selectedTower.type !== 'gold' && selectedTower.disableTimer > 0) return showToast('防禦塔處於癱瘓狀態，無法升級！');

  let baseMap = { dmg: 50, rng: 40, spd: 60, spec: 100 };
  let lvProp = stat === 'spec' ? 'specLv' : `${stat}Lv`;
  let cost = getUpgradeCost(baseMap[stat], rate, selectedTower[lvProp]);
  if (gold >= cost) {
    gold -= cost; selectedTower[lvProp]++;
    saveGameToLocalStorage();
    updateUI(); openTowerOverlay();
  } else showToast('金幣不足！');
}

function sellTower() {
  if (!selectedTower) return;
  let idx = towers.indexOf(selectedTower);
  if (idx !== -1) {
    gold += parseInt(document.getElementById('tu-sell-val').innerText);
    towers.splice(idx, 1); selectedTower = null;
    document.getElementById('tower-upgrade-overlay').style.display = 'none';
    saveGameToLocalStorage();
    updateUI(); showToast('防禦塔已出售');
  }
}

// ============================================================================
// 7. 波次生成與敵人邏輯 (Wave Management & Enemy Spawning)
// ============================================================================
function startWave() {
  if (waveInProgress) return;
  waveInProgress = true;
  currentWave++;
  updateUI();
  updateSkillUI();
  waveSpawnQueue = [];
  
  let count = Math.floor(8 + currentWave * 1.5 + Math.pow(currentWave, 1.1) * 0.2);
  let maxWaveDuration = 55;
  spawnInterval = Math.max(0.2, Math.min(1.0, maxWaveDuration / count));
  
  let isBossWave = (currentWave % 5 === 0);
  
  let priestNum = 0;
  if (currentWave >= 21) {
    priestNum = Math.floor((currentWave - 21) / 10) + 1;
  }
  
  let monkNum = 0;
  if (currentWave >= 31) {
    monkNum = Math.min(10, Math.floor((currentWave - 31) / 5) + 1);
  }

  let totalSpecial = priestNum + monkNum;
  let specialIndicesMap = new Map();

  if (totalSpecial > 0) {
    let specialTypes = [];
    let pCount = priestNum, mCount = monkNum;
    for (let k = 0; k < totalSpecial; k++) {
      if (k % 2 === 0) {
        if (pCount > 0) { specialTypes.push('priest'); pCount--; }
        else { specialTypes.push('monk'); mCount--; }
      } else {
        if (mCount > 0) { specialTypes.push('monk'); mCount--; }
        else { specialTypes.push('priest'); pCount--; }
      }
    }

    for (let k = 1; k <= totalSpecial; k++) {
      let targetPos = Math.round((k / (totalSpecial + 1)) * count);
      targetPos = Math.max(1, Math.min(count - 1, targetPos));
      while (specialIndicesMap.has(targetPos) && targetPos < count - 1) {
        targetPos++;
      }
      specialIndicesMap.set(targetPos, specialTypes[k - 1]);
    }
  }

  for (let i = 0; i < count; i++) {
    if (specialIndicesMap.has(i)) {
      let sType = specialIndicesMap.get(i);
      let baseHp = 40 + currentWave * 28 + Math.pow(currentWave, 1.45);
      if (sType === 'priest') {
        let hpVal = baseHp * 3;
        let speed = (0.85 + 0.85 * 0.5) / 2;
        waveSpawnQueue.push({
          type: 'priest', hp: hpVal, speed, gold: (15 + currentWave * 2) * 2,
          healTimer: 0, healRadius: 35, isStar: true
        });
      } else if (sType === 'monk') {
        let monkHp = (baseHp * 3) * 2.5;
        let monkSpeed = 0.85 * 0.75;
        let monkRadius = Math.min(55, 30 + Math.floor((currentWave - 31) / 5) * 5);
        waveSpawnQueue.push({
          type: 'monk', hp: monkHp, speed: monkSpeed, gold: (15 + currentWave * 2) * 2.5,
          blessTimer: 0, blessRadius: monkRadius, isStar: true
        });
      }
      continue;
    }

    let type = 'normal';
    let baseHp = 40 + currentWave * 28 + Math.pow(currentWave, 1.45); 
    let hpVal = baseHp, speed = 0.85;

    if (currentWave >= 11 && Math.random() < 0.3) {
      type = 'heavy'; hpVal = baseHp * 3; speed = 0.85 * 0.5;
    } else if (currentWave >= 6 && Math.random() < 0.35) {
      type = 'scout'; hpVal = baseHp * 0.4; speed = 0.85 * 3;
    }
    waveSpawnQueue.push({ type, hp: hpVal, speed, gold: 15 + currentWave * 2 });
  }
  
  if (isBossWave) {
    let rawBossHp = (currentWave === 5) ? 5000 : (800 + currentWave * 200 + Math.pow(currentWave, 1.5) * 120);
    let bossHp = toTwoSigFigsTrunc(rawBossHp);
    
    let freezeEffect = Math.max(0.40, 0.75 - Math.floor((currentWave - 5) / 5) * 0.05);
    
    let knockbackEffectiveness = 1.0;
    if (currentWave >= 15) {
      knockbackEffectiveness = Math.max(0.20, 0.70 - Math.floor((currentWave - 15) / 5) * 0.05);
    }

    let shockInterval = 10;
    if (currentWave >= 15 && currentWave % 2 !== 0) {
      let oddBonusIndex = Math.floor((currentWave - 15) / 10) + 1;
      shockInterval = Math.max(5, 10 - oddBonusIndex);
    }
    let shockRadius = 50;
    if (currentWave >= 20 && currentWave % 2 === 0) {
      let evenBonusIndex = Math.floor((currentWave - 20) / 10) + 1;
      shockRadius = Math.min(150, 50 + evenBonusIndex * 10);
    }
    let initialShockTimer = (currentWave >= 10) ? Math.max(0, shockInterval - 3) : 0;
    waveSpawnQueue.push({
      type: 'boss', hp: bossHp, speed: 0.6, gold: (15 + currentWave * 2) * 3,
      freezeEffectiveness: freezeEffect, knockbackEffectiveness,
      shockTimer: initialShockTimer, shockInterval, shockRadius,
      beamTimer: 0, stopTimer: 0
    });
  }
  saveGameToLocalStorage();
}

function updateSkillUI() {
  const container = document.getElementById('skills-list');

  container.innerHTML = '';
  Object.keys(activeSkills).forEach(key => {
    const s = activeSkills[key];
    const card = document.createElement('div');
    card.className = 'card';
    const isUnlocked = currentWave >= s.reqWave;
    const cdText = s.timer > 0 ? `(${s.timer.toFixed(1)}s)` : '';
    
    let infoVal = '', valLabel = '';
    if (key === 'meteor') { infoVal = `傷害: ${s.val + (s.valLv-1)*150}`; valLabel = '傷害'; }
    else if (key === 'blizzard') { infoVal = `冰凍: ${(s.val + (s.valLv-1)*1).toFixed(1)}s`; valLabel = '時間'; }
    else if (key === 'warDrum') { infoVal = `加速: ${(s.val + (s.valLv-1)*2).toFixed(1)}s`; valLabel = '時間'; }
    else if (key === 'barrier') { infoVal = `血量: ${s.val + (s.valLv-1)*250}`; valLabel = '血量'; }
    
    let curCd = Math.max(2, s.cd - (s.cdLv - 1) * 0.5);
    card.innerHTML = `
      <div class="card-name" style="color:#ffb86c">${s.name} <span id="cd-display-${key}" style="color:var(--danger)">${cdText}</span></div>
      <div class="card-stats">${infoVal} | CD: ${curCd.toFixed(1)}s</div>
      <button class="btn btn-primary" style="padding:3px 6px; font-size:10px; width:100%; margin-bottom:4px;" onclick="useSkill('${key}')">施放</button>
      <div style="display:flex; gap:4px;">
        <button class="btn" style="padding:2px 4px; font-size:9px; background:var(--purple); color:#000; flex:1;" onclick="upgradeSkill('${key}', 'val')">+${valLabel} (Lv.${s.valLv}) 💎${s.cost + s.valLv - 1}</button>
        <button class="btn" style="padding:2px 4px; font-size:9px; background:var(--cyan); color:#000; flex:1;" onclick="upgradeSkill('${key}', 'cd')">-CD (Lv.${s.cdLv}) 💎${s.cost + s.cdLv - 1}</button>
      </div>`;
    if (!isUnlocked) {
      const lockOverlay = document.createElement('div');
      lockOverlay.className = 'skill-lock-overlay';
      lockOverlay.innerHTML = `🔒 第 ${s.reqWave} 波解鎖`;
      card.appendChild(lockOverlay);
    }
    container.appendChild(card);
  });
}

function useSkill(key) {
  const s = activeSkills[key];
  if (currentWave < s.reqWave) return showToast(`🔒 【${s.name}】需達到第 ${s.reqWave} 波方可解鎖！`);
  if (s.timer > 0) return showToast('技能正在冷卻中！');
  let curCd = Math.max(2, s.cd - (s.cdLv - 1) * 0.5);
  s.timer = curCd;
  playSound('skill');
  if (key === 'meteor') {
    let dmg = s.val + (s.valLv - 1) * 150;
    enemies.forEach(e => takeDamage(e, dmg));
    activeVisualEffects.push({ type: 'meteor', life: 0.8, maxLife: 0.8 });
    showToast(`☄ 流星雨造成了 ${dmg} 點範圍傷害！`);
  } else if (key === 'blizzard') {
    let dur = s.val + (s.valLv - 1) * 1;
    enemies.forEach(e => {
      if (!e.immuneTimer) e.freezeTimer = dur;
    });
    activeVisualEffects.push({ type: 'blizzard', life: dur, maxLife: dur });
    showToast(`❄ 暴風雪降臨！全場敵軍冰封 ${dur.toFixed(1)} 秒！`);
  } else if (key === 'warDrum') {
    let dur = s.val + (s.valLv - 1) * 2;
    towers.forEach(t => t.drumTimer = dur);
    activeVisualEffects.push({ type: 'warDrum', life: 1.2, maxLife: 1.2 });
    showToast(`🥁 戰鼓響起！全塔攻速提升 100% 持續 ${dur.toFixed(1)} 秒！`);
  } else if (key === 'barrier') {
    let frontEnemy = enemies.slice().sort((a,b) => b.pathIndex - a.pathIndex)[0];
    let spawnX = frontEnemy ? frontEnemy.x : 200, spawnY = frontEnemy ? frontEnemy.y : 180;
    let barrierHp = s.val + (s.valLv - 1) * 250;
    barriers.push({ x: spawnX, y: spawnY, hp: barrierHp, maxHp: barrierHp, attackTimer: 0 });
    showToast('🛡 成功召喚大地障礙！');
  }
}

function upgradeSkill(key, type) {
  const s = activeSkills[key];
  let curLv = type === 'val' ? s.valLv : s.cdLv;
  let reqCost = s.cost + curLv - 1;
  if (crystals >= reqCost) {
    crystals -= reqCost;
    if (type === 'val') { s.valLv++; showToast(`【${s.name}】數值效果已提升！`); }
    else { s.cdLv++; showToast(`【${s.name}】冷卻時間已縮短！`); }
    saveGameToLocalStorage();
    updateSkillUI(); updateUI();
  } else showToast('鑽石不足！');
}

// ============================================================================
// 9. 全局科技系統 (Global Tech Tree System)
// ============================================================================
function updateTechUI() {
  const container = document.getElementById('tech-list');
  if (!container) return;
  container.innerHTML = '';
  Object.keys(talents).forEach(key => {
    const t = talents[key];
    let totalValStr = '';
    if (key === 'goldBonus') totalValStr = `目前加成: +${t.lv * 10}% 金幣`;
    else if (key === 'baseAtk') totalValStr = `目前加成: +${t.lv * 8}% 基礎攻擊`;
    else if (key === 'maxHpBonus') totalValStr = `目前加成: +${t.lv * 20} 主城生命值上限`;
    else if (key === 'castleRegen') totalValStr = `目前回復: 波次結束 +${t.lv * 5} 生命值`;

    const div = document.createElement('div');
    div.style.cssText = 'display:flex; justify-content:space-between; align-items:center; background:var(--card-bg); padding:8px 12px; border-radius:6px; border:1px solid var(--border-color);';
    div.innerHTML = `
      <div>
        <div style="font-weight:bold; color:var(--primary);">${t.name} (Lv.${t.lv}/${t.max})</div>
        <div style="font-size:11px; color:#a0a0a0;">${t.desc}</div>
        <div style="font-size:11px; color:var(--cyan); margin-top:2px;">${totalValStr}</div>
      </div>
      <button class="btn" style="padding:4px 10px; font-size:11px; background:var(--purple); color:#000;" onclick="buyTalent('${key}')">升級 💎${t.cost + t.lv}</button>`;
    container.appendChild(div);
  });
}

function buyTalent(key) {
  const t = talents[key], reqCost = t.cost + t.lv;
  if (t.lv >= t.max) return showToast('該科技已達最高等級 (50級)！');
  if (crystals >= reqCost) {
    crystals -= reqCost; t.lv++;
    if (key === 'maxHpBonus') hp += 20;
    showToast(`成功升級【${t.name}】！`);
    saveGameToLocalStorage();
    updateTechUI(); updateUI();
  } else showToast('鑽石不足！');
}

function saveCheckpoint() {
  checkpointState = JSON.parse(JSON.stringify({ gold, crystals, currentWave, hp, talents, activeSkills, towers, stats, seenEnemyTypes: Array.from(seenEnemyTypes) }));
  showToast(`💾 第 ${currentWave} 波自動存檔 Checkpoint 已更新！`);
  saveGameToLocalStorage();
}

function loadCheckpoint() {
  if (!checkpointState) return false;
  let data = JSON.parse(JSON.stringify(checkpointState));
  gold = data.gold; crystals = data.crystals; currentWave = data.currentWave; hp = data.hp;
  talents = data.talents; activeSkills = data.activeSkills; towers = data.towers; stats = data.stats;
  seenEnemyTypes = new Set(data.seenEnemyTypes || []);
  enemies = []; projectiles = []; barriers = []; shockwaves = []; bossBeams = []; cannonExplosions = []; activeVisualEffects = [];
  waveInProgress = false;
  updateUI(); updateSkillUI(); updateTechUI();
  saveGameToLocalStorage();
  return true;
}

function restartGame() {
  document.getElementById('gameover-modal').style.display = 'none';
  if (checkpointState && checkpointState.currentWave > 0) {
    loadCheckpoint(); showToast(`已載入第 ${currentWave} 波存檔數據！`);
  } else {
    hp = 100; gold = 300; crystals = 0; currentWave = 0;
    seenEnemyTypes = new Set();
    towers = []; enemies = []; projectiles = []; barriers = []; shockwaves = []; bossBeams = []; cannonExplosions = []; activeVisualEffects = [];
    waveInProgress = false;
    stats = { totalKills: 0, totalDamage: 0, totalGoldEarned: 300 };
    Object.keys(talents).forEach(k => talents[k].lv = 0);
    Object.keys(activeSkills).forEach(k => { activeSkills[k].valLv = 1; activeSkills[k].cdLv = 1; activeSkills[k].timer = 0; });
    saveGameToLocalStorage();
    updateUI(); updateSkillUI(); updateTechUI();
    showToast('遊戲完全重置！');
  }
}

// ============================================================================
// 10. 遊戲核心主迴圈與狀態更新 (Game Loop & State Updates)
// ============================================================================
function takeDamage(enemy, dmg, sourceTower = null) {
  if (enemy.dead) return;
  let baseBonus = 1 + talents.baseAtk.lv * 0.08;
  let finalDmg = dmg * baseBonus;
  enemy.hp -= finalDmg;
  stats.totalDamage += finalDmg;
  
  let shouldShowText = true;
  if (sourceTower) {
    sourceTower.attackTickCount = (sourceTower.attackTickCount || 0) + 1;
    if (gameSpeed > 1) {
      shouldShowText = (sourceTower.attackTickCount % gameSpeed === 0);
    }
  }

  if (shouldShowText) {
    let textColor = '#fff';
    let fontScale = 1.0;
    if (sourceTower && sourceTower.type === 'inferno' && sourceTower.infernoMode === 1) {
      let progress = Math.min(1.0, (sourceTower.lockTime || 0) / 4.0);
      fontScale = 1.0 + progress;
      let r = 255;
      let g = Math.floor(255 * (1 - progress));
      let b = Math.floor(255 * (1 - progress));
      textColor = `rgb(${r}, ${g}, ${b})`;
    }
    addFloatingText(enemy.x, enemy.y - 10, Math.floor(finalDmg), textColor, Math.round(12 * fontScale));
  }

  if (enemy.hp <= 0) {
    enemy.dead = true;
    stats.totalKills++;
    let goldGain = enemy.gold * (1 + talents.goldBonus.lv * 0.1);
    gold += goldGain;
    stats.totalGoldEarned += goldGain;
    if (enemy.type === 'boss') {
      let bossCrystalReward = 5 + Math.floor((currentWave - 5) / 5) * 2;
      crystals += bossCrystalReward;
      showToast(`🎉 擊殺 BOSS！獲得 ${bossCrystalReward} 顆鑽石與巨額金幣！`);
    }
    updateUI();
  }
}

function applyKnockback(enemy, distPx) {
  if (enemy.dead) return;
  if (enemy.immuneTimer > 0) return;

  let effectiveDist = distPx;
  if (enemy.type === 'boss' && enemy.knockbackEffectiveness !== undefined) {
    effectiveDist *= enemy.knockbackEffectiveness;
  }

  enemy.knockback = {
    totalDist: effectiveDist,
    remDist: effectiveDist,
    duration: 0.5,
    timer: 0.5
  };
}

function processKnockback(enemy, dt) {
  if (!enemy.knockback || enemy.knockback.timer <= 0) return;
  let kb = enemy.knockback;
  let ratio = kb.timer / kb.duration;
  let step = kb.totalDist * (2 * ratio) * (dt / kb.duration);
  step = Math.min(step, kb.remDist);
  kb.remDist -= step;
  kb.timer -= dt;
  
  let currStep = step;
  while (currStep > 0 && enemy.pathIndex >= 0) {
    let prevSegStart = path[enemy.pathIndex];
    let dx = enemy.x - prevSegStart.x;
    let dy = enemy.y - prevSegStart.y;
    let distToPrev = Math.hypot(dx, dy);
    
    if (currStep <= distToPrev) {
      if (distToPrev > 0) {
        enemy.x -= (dx / distToPrev) * currStep;
        enemy.y -= (dy / distToPrev) * currStep;
      }
      currStep = 0;
    } else {
      enemy.x = prevSegStart.x;
      enemy.y = prevSegStart.y;
      currStep -= distToPrev;
      if (enemy.pathIndex > 0) enemy.pathIndex--;
      else break;
    }
  }
}

let lastTime = performance.now();
function gameLoop(now) {
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;
  if (!isPaused) {
    updateGame(dt * gameSpeed);
  }
  renderGame();
  requestAnimationFrame(gameLoop);
}

function updateGame(dt) {
  if (waveInProgress && waveSpawnQueue.length > 0) {
    spawnTimer += dt;
    if (spawnTimer >= spawnInterval) {
      spawnTimer = 0;
      let eData = waveSpawnQueue.shift();
      if (eData.type !== 'boss' && !seenEnemyTypes.has(eData.type)) {
        seenEnemyTypes.add(eData.type);
        showEnemyIntro(eData.type);
      }
      
      if (eData.type === 'boss') showToast('⚠️ 強敵 BOSS 降臨！');

      enemies.push({
        id: Date.now() + Math.random(), type: eData.type, x: path[0].x, y: path[0].y,
        hp: eData.hp, maxHp: eData.hp, speed: eData.speed, gold: eData.gold,
        freezeEffectiveness: eData.freezeEffectiveness || (eData.type === 'scout' ? 0.8 : 1.0),
        knockbackEffectiveness: eData.knockbackEffectiveness,
        pathIndex: 0, freezeTimer: 0, immuneTimer: 0, dead: false,
        shockTimer: eData.shockTimer || 0, shockInterval: eData.shockInterval || 10, shockRadius: eData.shockRadius || 50,
        beamTimer: 0, stopTimer: 0,
        healTimer: 0, healRadius: eData.healRadius || 35,
        blessTimer: 0, blessRadius: eData.blessRadius || 30, isStar: !!eData.isStar
      });
    }
  }

  Object.keys(activeSkills).forEach(k => {
    let s = activeSkills[k];
    if (s.timer > 0) {
      s.timer = Math.max(0, s.timer - dt);
      const cdElem = document.getElementById(`cd-display-${k}`);
      if (cdElem) cdElem.innerText = s.timer > 0 ? `(${s.timer.toFixed(1)}s)` : '';
    }
  });

  towers.forEach(t => {
    if (t.disableTimer > 0) t.disableTimer = Math.max(0, t.disableTimer - dt);
  });

  for (let i = enemies.length - 1; i >= 0; i--) {
    let e = enemies[i];
    if (e.dead) { enemies.splice(i, 1); continue; }
    
    processKnockback(e, dt);

    if (e.immuneTimer > 0) {
      e.immuneTimer -= dt;
    }

    let speedMult = 1.0;
    if (e.freezeTimer > 0) {
      if (e.immuneTimer > 0) {
        e.freezeTimer = 0;
      } else {
        e.freezeTimer -= dt;
        speedMult = (e.type === 'boss') ? (1.0 - e.freezeEffectiveness) : (e.type === 'scout' ? 0.2 : 0.0);
      }
    }
    if (e.stopTimer > 0) { e.stopTimer -= dt; speedMult = 0; }

    if (e.type === 'priest') {
      e.healTimer += dt;
      if (e.healTimer >= 5.0) {
        e.healTimer = 0;
        enemies.forEach(other => {
          if (!other.dead && Math.hypot(other.x - e.x, other.y - e.y) <= e.healRadius) {
            let healAmount = other.maxHp * 0.15;
            other.hp = Math.min(other.maxHp, other.hp + healAmount);
            addFloatingText(other.x, other.y - 15, `+${Math.floor(healAmount)}`, '#50fa7b');
          }
        });
        activeVisualEffects.push({ type: 'healPulse', x: e.x, y: e.y, r: e.healRadius, life: 0.5, maxLife: 0.5 });
      }
    }

    if (e.type === 'monk') {
      e.blessTimer += dt;
      if (e.blessTimer >= 8.0) {
        e.blessTimer = 0;
        enemies.forEach(other => {
          if (!other.dead && Math.hypot(other.x - e.x, other.y - e.y) <= e.blessRadius) {
            other.freezeTimer = 0;
            other.knockback = null;
            other.immuneTimer = 1.5;
            addFloatingText(other.x, other.y - 15, '淨化!', '#bd93f9');
          }
        });
        activeVisualEffects.push({ type: 'blessPulse', x: e.x, y: e.y, r: e.blessRadius, life: 0.5, maxLife: 0.5 });
      }
    }

    if (e.type === 'boss') {
      if (currentWave >= 10) {
        e.shockTimer += dt;
        if (e.shockTimer >= e.shockInterval) {
          e.shockTimer = 0; e.stopTimer = 1.0;
          shockwaves.push({ x: e.x, y: e.y, r: 0, maxR: e.shockRadius, alpha: 1.0 });
          towers.forEach(t => {
            if (t.type !== 'gold' && Math.hypot(t.x - e.x, t.y - e.y) <= e.shockRadius) t.disableTimer = 3.0;
          });
          showToast('⚡ BOSS 釋放圓形衝擊波！範圍內防禦塔癱瘓 3 秒！');
        }
      }
      if (currentWave >= 15) {
        e.beamTimer += dt;
        if (e.beamTimer >= 8) {
          e.beamTimer = 0;
          let goldTowers = towers.filter(t => t.type === 'gold').sort((a,b) => Math.hypot(a.x - e.x, a.y - e.y) - Math.hypot(b.x - e.x, b.y - e.y));
          if (goldTowers.length > 0) {
            let nearestGold = goldTowers[0];
            bossBeams.push({ x1: e.x, y1: e.y, x2: nearestGold.x, y2: nearestGold.y, alpha: 1.0 });
            towers.forEach(t => {
              if (t.type === 'gold' && Math.hypot(t.x - nearestGold.x, t.y - nearestGold.y) <= 40) t.disableTimer = 3.0;
            });
            showToast('💥 BOSS 發射干擾光束！範圍內點金之塔停止生產 3 秒！');
          }
        }
      }
    }

    let blocked = false;
    for (let j = barriers.length - 1; j >= 0; j--) {
      let b = barriers[j];
      if (Math.hypot(b.x - e.x, b.y - e.y) < 25) {
        blocked = true;
        b.attackTimer += dt;
        if (b.attackTimer >= 1.0) {
          b.attackTimer = 0; b.hp -= 20;
          takeDamage(e, 200);
          if (b.hp <= 0) barriers.splice(j, 1);
        }
        break;
      }
    }
    if (blocked || e.dead) continue;

    let target = path[e.pathIndex + 1];
    if (target) {
      let dx = target.x - e.x, dy = target.y - e.y, dist = Math.hypot(dx, dy);
      let step = e.speed * speedMult * 60 * dt;
      if (dist <= step) { e.x = target.x; e.y = target.y; e.pathIndex++; }
      else { e.x += (dx / dist) * step; e.y += (dy / dist) * step; }
    } else {
      hp -= (e.type === 'boss' ? 30 : 10);
      e.dead = true;
      enemies.splice(i, 1);
      updateUI();
      if (hp <= 0) return triggerGameOver();
    }
  }

  let boss = enemies.find(e => e.type === 'boss');
  const bossHpContainer = document.getElementById('boss-hp-container');
  if (boss) {
    bossHpContainer.style.display = 'block';
    document.getElementById('boss-hp-bar-fill').style.width = `${Math.max(0, (boss.hp / boss.maxHp) * 100)}%`;
    document.getElementById('boss-hp-text').innerText = `${Math.floor(boss.hp)} / ${Math.floor(boss.maxHp)}`;
    document.getElementById('boss-freeze-val').innerText = `${Math.round((1.0 - boss.freezeEffectiveness) * 100)}%`;
    
    const bossSkillsDescElem = document.getElementById('boss-skills-desc');
    if (currentWave < 10) {
      bossSkillsDescElem.style.display = 'none';
    } else {
      bossSkillsDescElem.style.display = 'inline';
      let skillTexts = [];
      if (currentWave >= 10) skillTexts.push(`能力：釋放範圍衝擊波 (癱瘓塔 3.0 秒)`);
      if (currentWave >= 15) {
        let kbPct = Math.round((boss.knockbackEffectiveness || 1.0) * 100);
        skillTexts.push(`擊退（僅受 ${kbPct}% 的擊退效果）`);
        skillTexts.push(`發射干擾光束`);
      }
      bossSkillsDescElem.innerText = skillTexts.join(' | ');
    }
  } else bossHpContainer.style.display = 'none';

  shockwaves.forEach((sw, idx) => { sw.r += 60 * dt; sw.alpha -= 1.0 * dt; if (sw.alpha <= 0) shockwaves.splice(idx, 1); });
  bossBeams.forEach((bm, idx) => { bm.alpha -= 1.5 * dt; if (bm.alpha <= 0) bossBeams.splice(idx, 1); });
  cannonExplosions.forEach((ex, idx) => { ex.alpha -= 2.0 * dt; if (ex.alpha <= 0) cannonExplosions.splice(idx, 1); });
  activeVisualEffects.forEach((ve, idx) => { ve.life -= dt; if (ve.life <= 0) activeVisualEffects.splice(idx, 1); });

  let anyInfernoActive = false;

  towers.forEach(t => {
    if (t.drumTimer > 0) t.drumTimer -= dt;
    if (t.disableTimer > 0) return;
    let speedMult = t.drumTimer > 0 ? 2.0 : 1.0;
    let curCd = (TOWER_TYPES[t.type].cd / (1 + (t.spdLv - 1) * 0.05)) / speedMult;
    let curRange = TOWER_TYPES[t.type].range * (1 + (t.rngLv - 1) * 0.05);

    if (t.type === 'gold') {
      if (waveInProgress && enemies.length > 0) {
        t.cooldown += dt;
        if (t.cooldown >= curCd) {
          t.cooldown = 0;
          let earned = 15 + (t.specLv - 1) * 10;
          gold += earned; stats.totalGoldEarned += earned;
          addFloatingText(t.x, t.y - 15, `+💰${earned}`, '#f1fa8c');
          updateUI();
        }
      }
      return;
    }

    if (t.type === 'knockback') {
      if (!t.hammerState) t.hammerState = 'idle';
      if (t.hammerScale === undefined) t.hammerScale = 1.0;
      if (t.hammerRot === undefined) t.hammerRot = 0;

      if (t.hammerState === 'idle') {
        t.hammerScale = 1.0;
        t.hammerRot = 0;
        t.cooldown += dt;
        if (t.cooldown >= curCd) {
          let targets = enemies.filter(e => !e.dead && Math.hypot(e.x - t.x, e.y - t.y) <= curRange);
          if (targets.length > 0) {
            t.cooldown = 0;
            t.hammerState = 'shrinking';
          }
        }
      } else if (t.hammerState === 'shrinking') {
        let shrinkDuration = Math.min(0.1, curCd * 0.2);
        t.hammerScale -= (0.35 / shrinkDuration) * dt;
        if (t.hammerScale <= 0.65) {
          t.hammerScale = 0.65;
          t.hammerState = 'recovering';
          playSound('hammerImpact');
          let baseDmg = TOWER_TYPES.knockback.damage * (1 + (t.dmgLv - 1) * 0.1);
          let kbDist = 5 + (t.specLv - 1);
          let targets = enemies.filter(e => !e.dead && Math.hypot(e.x - t.x, e.y - t.y) <= curRange);
          targets.forEach(e => {
            takeDamage(e, baseDmg, t);
            applyKnockback(e, kbDist);
          });
          activeVisualEffects.push({ type: 'hammerSlamWave', x: t.x, y: t.y, maxR: curRange, life: 0.3, maxLife: 0.3 });
          playSound('gearRotate');
        }
      } else if (t.hammerState === 'recovering') {
        let recoverDuration = Math.max(0.2, curCd * 0.7);
        t.hammerScale += (0.35 / recoverDuration) * dt;
        t.hammerRot += (Math.PI * 2 / recoverDuration) * dt;
        if (t.hammerScale >= 1.0) {
          t.hammerScale = 1.0;
          t.hammerRot = 0;
          t.hammerState = 'idle';
        }
      }
      return;
    }
    
    let inRangeEnemies = enemies.filter(e => !e.dead && Math.hypot(e.x - t.x, e.y - t.y) <= curRange);
    if (inRangeEnemies.length > 0) {
      inRangeEnemies.sort((a, b) => {
        if (a.pathIndex !== b.pathIndex) return b.pathIndex - a.pathIndex;
        let nextA = path[a.pathIndex + 1], nextB = path[b.pathIndex + 1];
        if (!nextA || !nextB) return 0;
        return Math.hypot(nextA.x - a.x, nextA.y - a.y) - Math.hypot(nextB.x - b.x, nextB.y - b.y);
      });
    }

    if (t.type === 'inferno') {
      if (t.infernoMode === 1) {
        let lockTarget = null;
        if (t.targetLockId) {
          lockTarget = enemies.find(e => !e.dead && e.id === t.targetLockId) || null;
        }
        
        if (!lockTarget && inRangeEnemies.length > 0) {
          lockTarget = inRangeEnemies[0];
          t.targetLockId = lockTarget.id;
          t.lockTime = 0;
        } else if (!lockTarget) {
          t.targetLockId = null;
          t.lockTime = 0;
        }

        if (lockTarget) {
          anyInfernoActive = true;
          t.lockTime += dt;
          t.cooldown += dt;
          let maxMult = 3.0 + (t.specLv - 1) * 0.4;
          let currentMult = 1.0 + Math.min(1.0, t.lockTime / 4.0) * (maxMult - 1.0);

          if (t.cooldown >= curCd) {
            t.cooldown = 0;
            let baseDmg = TOWER_TYPES.inferno.damage * (1 + (t.dmgLv - 1) * 0.1);
            takeDamage(lockTarget, baseDmg * currentMult, t);
          }
          
          let growthProgress = Math.min(1.0, t.lockTime / 4.0);
          activeVisualEffects.push({
            type: 'infernoContinuousBeam',
            x1: t.x, y1: t.y, x2: lockTarget.x, y2: lockTarget.y,
            lockTime: t.lockTime, growthProgress: growthProgress,
            targetEnemy: lockTarget, life: 0.05, maxLife: 0.05
          });
        }
      } else {
        t.targetLockId = null; t.lockTime = 0;
        t.cooldown += dt;
        let maxTargets = 4 + (t.specLv - 1);
        let targets = inRangeEnemies.slice(0, maxTargets);
        if (targets.length > 0) anyInfernoActive = true;

        if (t.cooldown >= curCd) {
          t.cooldown = 0;
          let baseDmg = TOWER_TYPES.inferno.damage * (1 + (t.dmgLv - 1) * 0.1);
          targets.forEach(tgt => {
            takeDamage(tgt, baseDmg, t);
          });
        }

        targets.forEach(tgt => {
          activeVisualEffects.push({
            type: 'infernoContinuousBeam',
            x1: t.x, y1: t.y, x2: tgt.x, y2: tgt.y,
            lockTime: 0, growthProgress: 0,
            targetEnemy: tgt, life: 0.05, maxLife: 0.05
          });
        });
      }
      return;
    }

    t.cooldown += dt;
    if (t.cooldown >= curCd) {
      if (inRangeEnemies.length > 0) {
        let target = inRangeEnemies[0];
        t.cooldown = 0; playSound('shoot');
        if (t.type === 'tesla') {
          let jumpsMax = t.specLv + 1;
          let baseDmg = TOWER_TYPES.tesla.damage * (1 + (t.dmgLv - 1) * 0.1);
          let chainTargets = [target];
          let currentTarget = target;
          
          for (let j = 1; j < jumpsMax; j++) {
            let candidates = enemies.filter(e => !e.dead && !chainTargets.includes(e) && Math.hypot(e.x - currentTarget.x, e.y - currentTarget.y) <= 130);
            if (candidates.length > 0) {
              candidates.sort((a, b) => Math.hypot(a.x - currentTarget.x, a.y - currentTarget.y) - Math.hypot(b.x - currentTarget.x, b.y - currentTarget.y));
              currentTarget = candidates[0];
              chainTargets.push(currentTarget);
            } else break;
          }
          
          activeVisualEffects.push({
            type: 'teslaChainProcess',
            tower: t, targets: chainTargets, currentIndex: 0,
            timer: -0.2, interval: 0.2, baseDmg: baseDmg, arcs: []
          });
        } else {
          projectiles.push({
            x: t.x, y: t.y, target, type: t.type, speed: 420,
            baseDmg: TOWER_TYPES[t.type].damage * (1 + (t.dmgLv - 1) * 0.1), specLv: t.specLv, srcX: t.x, srcY: t.y, srcTower: t
          });
        }
      }
    }
  });

  if (anyInfernoActive) startHumSound();
  else stopHumSound();

  for (let i = activeVisualEffects.length - 1; i >= 0; i--) {
    let ve = activeVisualEffects[i];
    if (ve.type === 'teslaChainProcess') {
      ve.timer += dt;
      if (ve.currentIndex < ve.targets.length && ve.timer >= ve.interval) {
        ve.timer = 0;
        let hitEnemy = ve.targets[ve.currentIndex];
        if (!hitEnemy.dead) {
          let dmg = ve.currentIndex === 0 ? ve.baseDmg : ve.baseDmg * 0.7;
          takeDamage(hitEnemy, dmg, ve.tower);
          playSound('zap');
          activeVisualEffects.push({ type: 'teslaCircleArc', enemy: hitEnemy, x: hitEnemy.x, y: hitEnemy.y, life: 0.3, maxLife: 0.3 });
          let prevPoint = ve.currentIndex === 0 ? { x: ve.tower.x, y: ve.tower.y } : { x: ve.targets[ve.currentIndex - 1].x, y: ve.targets[ve.currentIndex - 1].y };
          ve.arcs.push({ x1: prevPoint.x, y1: prevPoint.y, x2: hitEnemy.x, y2: hitEnemy.y });
        }
        ve.currentIndex++;
      }
      if (ve.currentIndex >= ve.targets.length) {
        ve.displayTimer = (ve.displayTimer || 0) + dt;
        if (ve.displayTimer >= 0.3) activeVisualEffects.splice(i, 1);
      }
    }
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    let p = projectiles[i];
    if (p.target.dead) { projectiles.splice(i, 1); continue; }
    let dx = p.target.x - p.x, dy = p.target.y - p.y, dist = Math.hypot(dx, dy);
    let step = p.speed * dt;
    if (dist <= step) {
      playSound('hit');
      let finalDmg = p.baseDmg;
      if (p.type === 'arrow') {
        let flightDist = Math.hypot(p.target.x - p.srcX, p.target.y - p.srcY);
        takeDamage(p.target, finalDmg * (1 + (0.01 * p.specLv * (flightDist / 10))), p.srcTower);
      } else if (p.type === 'cannon') {
        let radius = 40 + (p.specLv - 1) * 5;
        cannonExplosions.push({ x: p.target.x, y: p.target.y, radius, alpha: 0.6 });
        enemies.forEach(e => { if (Math.hypot(e.x - p.target.x, e.y - p.target.y) <= radius) takeDamage(e, finalDmg, p.srcTower); });
      } else if (p.type === 'frost') {
        takeDamage(p.target, finalDmg, p.srcTower);
        if (!p.target.immuneTimer) p.target.freezeTimer = 1.5 + (p.specLv - 1) * 0.5;
      }
      projectiles.splice(i, 1);
    } else {
      p.x += (dx / dist) * step; p.y += (dy / dist) * step;
    }
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    let ft = floatingTexts[i];
    ft.y -= 15 * dt; ft.alpha -= 1.0 * dt;
    if (ft.alpha <= 0) floatingTexts.splice(i, 1);
  }

  if (waveInProgress && enemies.length === 0 && waveSpawnQueue.length === 0) {
    waveInProgress = false;
    let waveCrystalBonus = 3 + Math.floor(currentWave / 5);
    crystals += waveCrystalBonus;
    if (talents.castleRegen.lv > 0) hp = Math.min(maxHp, hp + talents.castleRegen.lv * 5);
    showToast(`✨ 波次 ${currentWave} 通關！獲得 +${waveCrystalBonus} 鑽石`);
    if (currentWave % 5 === 0) saveCheckpoint();
    else saveGameToLocalStorage();
    updateUI();
    if (autoWave) setTimeout(() => { if (autoWave && !waveInProgress) startWave(); }, 1000);
  }
}

// ============================================================================
// 11. 遊戲畫面繪製與視覺特效 (Rendering Engine & VFX)
// ============================================================================
function drawJaggedLine(ctx, x1, y1, x2, y2, color = '#bd93f9') {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(x1, y1);
  let dist = Math.hypot(x2 - x1, y2 - y1);
  let steps = Math.max(3, Math.floor(dist / 15));
  for (let i = 1; i < steps; i++) {
    let t = i / steps;
    let px = x1 + (x2 - x1) * t + (Math.random() - 0.5) * 12;
    let py = y1 + (y2 - y1) * t + (Math.random() - 0.5) * 12;
    ctx.lineTo(px, py);
  }
  ctx.lineTo(x2, y2);
  ctx.stroke();
}

function drawCircleArc(ctx, x, y, radius, color = '#bd93f9') {
  ctx.strokeStyle = color;
  ctx.lineWidth = 2;
  ctx.beginPath();
  let points = 8;
  for (let i = 0; i <= points; i++) {
    let angle = (i / points) * Math.PI * 2;
    let offset = (Math.random() - 0.5) * 6;
    let r = radius + offset;
    let px = x + Math.cos(angle) * r;
    let py = y + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(px, py);
    else ctx.lineTo(px, py);
  }
  ctx.closePath();
  ctx.stroke();
}

function drawPortal(ctx, x, y) {
  let time = performance.now() * 0.003;
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(time);
  
  let grad = ctx.createRadialGradient(0, 0, 5, 0, 0, 25);
  grad.addColorStop(0, 'rgba(189, 147, 249, 0.8)');
  grad.addColorStop(0.5, 'rgba(139, 233, 253, 0.5)');
  grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
  
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(0, 0, 25, 0, Math.PI * 2);
  ctx.fill();
  ctx.strokeStyle = '#bd93f9';
  ctx.lineWidth = 2;
  ctx.beginPath();
  for (let i = 0; i < 4; i++) {
    ctx.arc(0, 0, 10 + i * 3, i * Math.PI / 2, i * Math.PI / 2 + Math.PI / 3);
  }
  ctx.stroke();
  ctx.restore();
}

function drawTowerIcon(ctx, x, y, type, radius = 16, towerObj = null) {
  let tInfo = TOWER_TYPES[type];
  
  if (type === 'knockback') {
    ctx.fillStyle = '#4a3b2c';
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2d2218'; ctx.lineWidth = 2; ctx.stroke();

    let scale = towerObj ? (towerObj.hammerScale || 1.0) : 1.0;
    let rot = towerObj ? (towerObj.hammerRot || 0) : 0;
    let side = (radius * 2) * scale;
    let half = side / 2;

    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rot);

    ctx.fillStyle = '#ffb86c';
    ctx.fillRect(-half, -half, side, side);

    ctx.strokeStyle = '#c4823f';
    ctx.lineWidth = Math.max(1.5, 2.5 * scale);
    ctx.strokeRect(-half, -half, side, side);

    let cornerSize = Math.max(3, 5 * scale);
    ctx.fillStyle = '#7a4b1c';
    ctx.fillRect(-half, -half, cornerSize, cornerSize);
    ctx.fillRect(half - cornerSize, -half, cornerSize, cornerSize);
    ctx.fillRect(-half, half - cornerSize, cornerSize, cornerSize);
    ctx.fillRect(half - cornerSize, half - cornerSize, cornerSize, cornerSize);

    ctx.restore();
  } else {
    ctx.fillStyle = tInfo.color;
    ctx.beginPath(); ctx.arc(x, y, radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#222';
    if (type === 'arrow') ctx.fillRect(x - 3, y - radius - 2, 6, 10);
    else if (type === 'cannon') ctx.fillRect(x - 5, y - radius - 4, 10, 12);
    else if (type === 'frost') { ctx.beginPath(); ctx.arc(x, y, radius*0.5, 0, Math.PI*2); ctx.fillStyle = '#fff'; ctx.fill(); }
    else if (type === 'tesla') { ctx.fillStyle = '#f1fa8c'; ctx.fillRect(x - 2, y - radius - 3, 4, 10); }
    else if (type === 'inferno') { ctx.fillStyle = '#ffff00'; ctx.beginPath(); ctx.arc(x, y, radius*0.4, 0, Math.PI*2); ctx.fill(); }
    else if (type === 'gold') { ctx.fillStyle = '#000'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('$', x - 4, y + 4); }
  }
}

function drawCastle(ctx, x, y) {
  ctx.fillStyle = '#44475a'; ctx.fillRect(x - 30, y - 40, 60, 80);
  ctx.strokeStyle = '#6272a4'; ctx.lineWidth = 3; ctx.strokeRect(x - 30, y - 40, 60, 80);
  ctx.fillStyle = '#282a36';
  for (let i = 0; i < 3; i++) ctx.fillRect(x - 28 + i * 20, y - 50, 14, 12);
  ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(x, y + 20, 12, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#ff5555'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(x, y - 40); ctx.lineTo(x, y - 65); ctx.stroke();
  ctx.fillStyle = '#ff5555'; ctx.beginPath(); ctx.moveTo(x, y - 65); ctx.lineTo(x + 15, y - 58); ctx.lineTo(x, y - 50); ctx.fill();
}

function renderGame() {
  if (!ctx) return;
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#181920'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  ctx.strokeStyle = '#282a36'; ctx.lineWidth = 42; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
  ctx.beginPath();
  path.forEach((p, idx) => { if (idx === 0) ctx.moveTo(p.x, p.y); else ctx.lineTo(p.x, p.y); });
  ctx.stroke();
  ctx.strokeStyle = '#44475a'; ctx.lineWidth = 6; ctx.stroke();
  
  drawPortal(ctx, path[0].x, path[0].y);
  drawCastle(ctx, 930, 300);
  
  barriers.forEach(b => {
    ctx.fillStyle = '#8B4513'; ctx.beginPath(); ctx.arc(b.x, b.y, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#DAA520'; ctx.stroke();
    ctx.fillStyle = '#ff4444'; ctx.fillRect(b.x - 15, b.y - 22, 30, 4);
    ctx.fillStyle = '#50fa7b'; ctx.fillRect(b.x - 15, b.y - 22, 30 * (b.hp / b.maxHp), 4);
  });
  
  towers.forEach(t => {
    drawTowerIcon(ctx, t.x, t.y, t.type, 16, t);
    ctx.strokeStyle = selectedTower === t ? '#50fa7b' : '#fff';
    ctx.lineWidth = selectedTower === t ? 3 : 1;
    ctx.stroke();
    if (t.disableTimer > 0) {
      ctx.fillStyle = 'rgba(255, 0, 0, 0.4)'; ctx.beginPath(); ctx.arc(t.x, t.y, 18, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#ff5555'; ctx.font = 'bold 12px sans-serif'; ctx.fillText('⚡', t.x - 5, t.y + 5);
    }
    if (selectedTower === t) {
      let r = TOWER_TYPES[t.type].range * (1 + (t.rngLv - 1) * 0.05);
      ctx.strokeStyle = 'rgba(80, 250, 123, 0.4)'; ctx.beginPath(); ctx.arc(t.x, t.y, r, 0, Math.PI * 2); ctx.stroke();
    }
  });
  
  if (placingType) {
    let valid = isValidPlacement(dragPos.x, dragPos.y) && towers.length < MAX_TOWER_COUNT;
    let r = TOWER_TYPES[placingType].range;
    ctx.strokeStyle = valid ? '#50fa7b' : '#ff5555'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(dragPos.x, dragPos.y, r, 0, Math.PI * 2); ctx.stroke();
    drawTowerIcon(ctx, dragPos.x, dragPos.y, placingType, 16);
  }
  
  cannonExplosions.forEach(ex => {
    ctx.fillStyle = `rgba(255, 68, 68, ${ex.alpha})`; ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2); ctx.fill();
  });
  shockwaves.forEach(sw => {
    ctx.strokeStyle = `rgba(255, 85, 85, ${sw.alpha})`; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(sw.x, sw.y, sw.r, 0, Math.PI * 2); ctx.stroke();
  });
  bossBeams.forEach(bm => {
    ctx.strokeStyle = `rgba(255, 0, 255, ${bm.alpha})`; ctx.lineWidth = 4; ctx.beginPath(); ctx.moveTo(bm.x1, bm.y1); ctx.lineTo(bm.x2, bm.y2); ctx.stroke();
  });
  
  enemies.forEach(e => {
    let color = e.type === 'boss' ? '#ff5555' : (e.type === 'scout' ? '#f1fa8c' : (e.type === 'heavy' ? '#bd93f9' : (e.type === 'priest' ? '#50fa7b' : (e.type === 'monk' ? '#bd93f9' : '#ffb86c'))));
    let size = e.type === 'boss' ? 18 : (e.type === 'scout' ? 7 : (e.type === 'heavy' ? 14 : (e.type === 'priest' ? 12 : (e.type === 'monk' ? 13 : 10))));
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(e.x, e.y, size, 0, Math.PI * 2); ctx.fill();
    
    if (e.isStar) {
      ctx.fillStyle = '#f1fa8c';
      ctx.font = 'bold 12px sans-serif';
      ctx.fillText('★', e.x - 5, e.y + 4);
    }
    if (e.freezeTimer > 0) { ctx.strokeStyle = '#8be9fd'; ctx.lineWidth = 3; ctx.stroke(); }
    if (e.immuneTimer > 0) { ctx.strokeStyle = '#bd93f9'; ctx.lineWidth = 3; ctx.stroke(); }
    let barW = size * 2;
    ctx.fillStyle = '#000'; ctx.fillRect(e.x - size, e.y - size - 8, barW, 4);
    ctx.fillStyle = '#50fa7b'; ctx.fillRect(e.x - size, e.y - size - 8, barW * (e.hp / e.maxHp), 4);
  });

  activeVisualEffects.forEach(ve => {
    let alpha = ve.life / ve.maxLife;
    if (ve.type === 'infernoContinuousBeam') {
      let dx = ve.x2 - ve.x1, dy = ve.y2 - ve.y1, dist = Math.hypot(dx, dy);
      let progress = ve.growthProgress || 0;
      let beamWidth = 4 * (1 + progress);

      ctx.strokeStyle = '#ff0033';
      ctx.lineWidth = beamWidth;
      ctx.beginPath(); ctx.moveTo(ve.x1, ve.y1); ctx.lineTo(ve.x2, ve.y2); ctx.stroke();

      if (dist > 0) {
        let nowSec = performance.now() * 0.003;
        let pOffset = (nowSec * 1.5) % 1.0;
        let darkX = ve.x1 + dx * pOffset;
        let darkY = ve.y1 + dy * pOffset;
        let darkR = 10 * (1 + progress);

        ctx.save();
        let grad = ctx.createRadialGradient(darkX, darkY, 2, darkX, darkY, darkR);
        grad.addColorStop(0, 'rgba(0, 0, 0, 0.85)');
        grad.addColorStop(0.6, 'rgba(20, 0, 0, 0.4)');
        grad.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = grad;
        ctx.beginPath();
        ctx.arc(darkX, darkY, darkR, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      let fireX = ve.x2, fireY = ve.y2;
      let fogR = 14 * (1 + progress);
      let flameR = (5 + Math.random() * 3) * (1 + progress);

      ctx.save();
      let fogGrad = ctx.createRadialGradient(fireX, fireY, 3, fireX, fireY, fogR);
      fogGrad.addColorStop(0, 'rgba(40, 40, 40, 0.6)');
      fogGrad.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = fogGrad;
      ctx.beginPath(); ctx.arc(fireX, fireY, fogR, 0, Math.PI * 2); ctx.fill();
      
      ctx.fillStyle = '#ff3300';
      ctx.beginPath(); ctx.arc(fireX, fireY, flameR, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffff00';
      ctx.beginPath(); ctx.arc(fireX, fireY, flameR * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

    } else if (ve.type === 'hammerSlamWave') {
      ctx.strokeStyle = `rgba(255, 184, 108, ${alpha})`;
      ctx.lineWidth = 4;
      ctx.beginPath(); ctx.arc(ve.x, ve.y, ve.maxR * (1 - alpha), 0, Math.PI * 2); ctx.stroke();
    } else if (ve.type === 'meteor') {
      ctx.fillStyle = `rgba(255, 50, 0, ${alpha * 0.35})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = `rgba(255, 200, 50, ${alpha})`; ctx.font = 'bold 36px sans-serif'; ctx.fillText('☄️ METEOR STRIKE ☄️', 330, 280);
    } else if (ve.type === 'blizzard') {
      ctx.fillStyle = `rgba(139, 233, 253, ${alpha * 0.2})`; ctx.fillRect(0, 0, canvas.width, canvas.height);
    } else if (ve.type === 'warDrum') {
      ctx.strokeStyle = `rgba(241, 250, 140, ${alpha})`; ctx.lineWidth = 4;
      towers.forEach(t => { ctx.beginPath(); ctx.arc(t.x, t.y, 24 + (1 - alpha) * 20, 0, Math.PI * 2); ctx.stroke(); });
    } else if (ve.type === 'healPulse') {
      ctx.strokeStyle = `rgba(80, 250, 123, ${alpha})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ve.x, ve.y, ve.r * (1 - alpha * 0.2), 0, Math.PI * 2); ctx.stroke();
    } else if (ve.type === 'blessPulse') {
      ctx.strokeStyle = `rgba(189, 147, 249, ${alpha})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(ve.x, ve.y, ve.r * (1 - alpha * 0.2), 0, Math.PI * 2); ctx.stroke();
    } else if (ve.type === 'teslaChainProcess') {
      ve.arcs.forEach(arc => { drawJaggedLine(ctx, arc.x1, arc.y1, arc.x2, arc.y2, '#bd93f9'); });
    } else if (ve.type === 'teslaCircleArc') {
      let enemyTarget = ve.enemy;
      let targetX = enemyTarget && !enemyTarget.dead ? enemyTarget.x : ve.x;
      let targetY = enemyTarget && !enemyTarget.dead ? enemyTarget.y : ve.y;
      drawCircleArc(ctx, targetX, targetY, 12, '#bd93f9');
    }
  });
  
  projectiles.forEach(p => {
    ctx.fillStyle = TOWER_TYPES[p.type].color; ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
  });
  
  floatingTexts.forEach(ft => {
    ctx.fillStyle = ft.color; ctx.globalAlpha = ft.alpha;
    let fSize = ft.fontSize || 12;
    ctx.font = `bold ${fSize}px sans-serif`;
    ctx.fillText(ft.text, ft.x - 10, ft.y); ctx.globalAlpha = 1.0;
  });
}

function triggerGameOver() {
  isPaused = true;
  document.getElementById('gameover-modal').style.display = 'flex';
  document.getElementById('go-desc').innerHTML = 
    `您在第 ${currentWave} 波落敗了！<br><br>` +
    `⚔️ 總擊殺敵數: ${stats.totalKills}<br>` +
    `💥 總累積傷害: ${Math.floor(stats.totalDamage)}<br>` +
    `💰 總累積金幣: ${Math.floor(stats.totalGoldEarned)}`;
}

// 12. 遊戲初始化與事件監聽 (Initialization & Event Listeners)
// ============================================================================
window.onload = function() {
  canvas = document.getElementById('gameCanvas');
  ctx = canvas.getContext('2d');
  
  loadGameFromLocalStorage();
  
  const shopContainer = document.getElementById('tower-shop');
  shopContainer.innerHTML = '';
  Object.keys(TOWER_TYPES).forEach(key => {
    const t = TOWER_TYPES[key];
    const card = document.createElement('div');
    card.className = 'card';
    card.onclick = (e) => { e.stopPropagation(); startPlacement(key); };
    let statsText = key === 'gold' ? `產金週期: ${t.cd}s` : `攻擊: ${t.damage} | 射程: ${t.range} | 攻速: ${(1/t.cd).toFixed(1)}/s`;
    card.innerHTML = `<div class="card-name" style="color:${t.color}">${t.name}</div><div class="card-stats">${statsText}</div><div class="card-desc">${t.desc}</div><div class="card-cost">💰 ${t.cost}</div>`;
    shopContainer.appendChild(card);
  });

  document.getElementById('tu-close').onclick = () => { document.getElementById('tower-upgrade-overlay').style.display = 'none'; };
  
  window.addEventListener('mousemove', () => { isMouseInput = true; });
  canvas.addEventListener('mousemove', (e) => {
    isMouseInput = true;
    handleMove(e.clientX, e.clientY);
  });
  canvas.addEventListener('touchmove', (e) => {
    isMouseInput = false;
    if (e.touches.length) handleMove(e.touches[0].clientX, e.touches[0].clientY);
  });

  canvas.addEventListener('click', (e) => {
    if (placingType) {
      if (isMouseInput) confirmPlacement();
      return;
    }
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    selectedTower = towers.find(t => Math.hypot(t.x - mx, t.y - my) < 22) || null;
    if (selectedTower) openTowerOverlay();
    else document.getElementById('tower-upgrade-overlay').style.display = 'none';
  });

  window.addEventListener('keydown', (e) => {
    if (placingType) {
      if (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space') {
        e.preventDefault(); confirmPlacement();
      } else if (e.code === 'Escape') {
        e.preventDefault(); cancelPlacement();
      }
    } else if (e.code === 'Space') {
      e.preventDefault(); togglePause();
    }
  });

  updateSkillUI(); updateTechUI(); updateUI();
  requestAnimationFrame(gameLoop);
};
</script>
</body>
</html>
